[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "breeden-litzenberger"
version = "0.1.0"
description = "Market-implied risk-neutral density extraction via Breeden & Litzenberger (1978)"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "yfinance>=0.2.40",
    "matplotlib>=3.8",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "mypy>=1.10",
    "scipy-stubs>=1.11",
    "pandas-stubs>=2.1",
]

[project.scripts]
bl = "breeden_litzenberger.cli:app"

[tool.setuptools.packages.find]
include = ["breeden_litzenberger*"]

[tool.mypy]
strict = true
packages = ["breeden_litzenberger"]

[tool.pytest.ini_options]
testpaths = ["tests"]
